services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "${HEIMLY_PORT}"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      CACHE_URL: "redis://valkey:6379/0"
      STORAGE_URL: "http://rustfs:9000"
      SHARE_DATA: "${SHARE_DATA:-true}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-720h}"
    ports:
      - "${HEIMLY_PORT}:${HEIMLY_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - heimly_config:/app/.heimly/config
    networks:
      - heimly_net

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - heimly_db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - heimly_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1']
      interval: 3s
      timeout: 10s
      retries: 3

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT}:6379"
    networks:
      - heimly_net
    volumes:
      - heimly_cache:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 3

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${RUSTFS_PORT}:9000"
      - "${RUSTFS_CONSOLE_PORT}:9001"
    volumes:
      - heimly_storage:/data
    networks:
      - heimly_net
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health && curl -fsS http://localhost:9001/rustfs/console/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  heimly_net:
    name: ${NETWORK_NAME}

volumes:
  heimly_config:
  heimly_db:
  heimly_cache:
  heimly_storage:
