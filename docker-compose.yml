name: ${HEIMLY_PROJECT_NAME:-heimly}
services:
  backend:
    image: ghcr.io/heimly-space/backend:latest
    restart: unless-stopped
    environment:
      PORT: "${HEIMLY_PORT}"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      CACHE_URL: "redis://valkey:6379/0"
      STORAGE_URL: "http://rustfs:9000"
      SHARE_DATA: "${SHARE_DATA:-true}"
      ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:-720h}"
    ports:
      - "${HEIMLY_PORT}:${HEIMLY_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - config:/app/.heimly/config
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:$${PORT}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1']
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 20s

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    networks:
      - private
    volumes:
      - cache:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - storage:/data
    networks:
      - private
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health && curl -fsS http://localhost:9001/rustfs/console/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  private:
    internal: true

volumes:
  config:
  db:
  cache:
  storage:
