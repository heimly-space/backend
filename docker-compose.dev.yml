services:
  api-docs:
    image: scalarapi/api-reference:latest
    restart: unless-stopped
    profiles:
      - docs
    ports:
      - "${DOCS_PORT:-8081}:8080"
    volumes:
      - ./api:/docs:ro
    environment:
      API_REFERENCE_CONFIG: >-
        {"sources":[{"url":"/openapi/openapi.yaml","title":"Heimly API Reference","default":true}],
         "theme":"bluePlanet",
         "layout":"modern",
         "metaData":{"title":"Heimly API Reference","description":"Heimly backend API docs"}}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://localhost:8080/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - heimly_dev_net

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - heimly_dev_db:/var/lib/postgresql
    networks:
      - heimly_dev_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1']
      interval: 3s
      timeout: 10s
      retries: 3

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT}:6379"
    volumes:
      - heimly_dev_cache:/data
    networks:
      - heimly_dev_net
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 3

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "${RUSTFS_PORT}:9000"
      - "${RUSTFS_CONSOLE_PORT}:9001"
    volumes:
      - heimly_dev_storage:/data
    networks:
      - heimly_dev_net
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health && curl -fsS http://localhost:9001/rustfs/console/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  heimly_dev_net:
    name: ${NETWORK_NAME}

volumes:
  heimly_dev_db:
  heimly_dev_cache:
  heimly_dev_storage:
