openapi: 3.0.3
info:
  title: Heimly Backend API
  version: 0.1.0
  description: API for auth workflow, current user profile, and household collaboration.
servers:
  - url: http://localhost:8080
    description: Local backend
tags:
  - name: system
  - name: auth
  - name: users
  - name: households
paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register user and return access + refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: User already exists
          content:
            text/plain:
              schema:
                type: string
                example: user already exists
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login and return access + refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            text/plain:
              schema:
                type: string
                example: invalid credentials
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token and return fresh access + refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Tokens rotated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid refresh token
          content:
            text/plain:
              schema:
                type: string
                example: invalid refresh token
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Logout current session by revoking refresh token and current access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Logged out successfully
        "400":
          description: Missing refresh token
          content:
            text/plain:
              schema:
                type: string
                example: refresh token is required
        "401":
          description: Invalid bearer token
          content:
            text/plain:
              schema:
                type: string
                example: invalid token
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/me:
    get:
      tags: [users]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing or invalid JWT token
          content:
            text/plain:
              schema:
                type: string
                example: invalid token
        "404":
          description: User not found
          content:
            text/plain:
              schema:
                type: string
                example: not found
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/households:
    get:
      tags: [households]
      summary: List current user's households with role info
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Opaque cursor returned by previous page
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Current user's households
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdsResponse"
        "400":
          description: Invalid cursor or limit
          content:
            text/plain:
              schema:
                type: string
                example: invalid cursor
        "401":
          description: Missing or invalid JWT token
          content:
            text/plain:
              schema:
                type: string
                example: invalid token
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [households]
      summary: Create a new household
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
      responses:
        "201":
          description: Household created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "400":
          description: Invalid request payload or missing household name
          content:
            text/plain:
              schema:
                type: string
                example: household name is required
        "401":
          description: Missing or invalid JWT token
          content:
            text/plain:
              schema:
                type: string
                example: invalid token
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/households/{id}/members:
    post:
      tags: [households]
      summary: Invite household member by email
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Member invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMemberResponse"
        "400":
          description: Invalid request payload or household id
          content:
            text/plain:
              schema:
                type: string
                example: invalid household id
        "401":
          description: Missing or invalid JWT token
          content:
            text/plain:
              schema:
                type: string
                example: invalid token
        "403":
          description: Current user is not a household member
          content:
            text/plain:
              schema:
                type: string
                example: forbidden
        "404":
          description: Household or invited user not found
          content:
            text/plain:
              schema:
                type: string
                example: user not found
        "409":
          description: User is already a household member
          content:
            text/plain:
              schema:
                type: string
                example: member already exists
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [households]
      summary: List household members
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Opaque cursor returned by previous page
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Household members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMembersResponse"
        "400":
          description: Invalid household id, cursor, or limit
          content:
            text/plain:
              schema:
                type: string
                example: invalid household id
        "401":
          description: Missing or invalid JWT token
          content:
            text/plain:
              schema:
                type: string
                example: invalid token
        "403":
          description: Current user is not a household member
          content:
            text/plain:
              schema:
                type: string
                example: forbidden
        "404":
          description: Household not found
          content:
            text/plain:
              schema:
                type: string
                example: household not found
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request payload
      content:
        text/plain:
          schema:
            type: string
            example: invalid request
    InternalError:
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
            example: internal error
  schemas:
    RegisterRequest:
      type: object
      required: [login, email, name, password]
      properties:
        login:
          type: string
          minLength: 1
          example: alice_liddell
        email:
          type: string
          format: email
          example: alice@example.com
        name:
          type: string
          minLength: 1
          example: Alice Liddell
        password:
          type: string
          minLength: 6
          example: supersecret123
        birthday:
          type: string
          format: date
          nullable: true
          example: "1995-10-15"
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: alice_liddell
        password:
          type: string
          example: supersecret123
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: 3cWJKJtwPf3N29...
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: yQf2X6lmjYJ-7B9...
    AuthResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: yQf2X6lmjYJ-7B9...
    UserResponse:
      type: object
      required: [id, login, email, name]
      properties:
        id:
          type: string
          format: uuid
          example: 3c5cb5e6-cd90-4b37-a0be-9f85f77f4f31
        login:
          type: string
          example: alice_liddell
        email:
          type: string
          format: email
          example: alice@example.com
        name:
          type: string
          example: Alice Liddell
        birthday:
          type: string
          format: date
          nullable: true
          example: "1995-10-15"
    CreateHouseholdRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: Wonderland Flat
    HouseholdResponse:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
          example: 8cd4bd93-c93f-4b39-9ebb-c787f9a6d268
        name:
          type: string
          example: Wonderland Flat
        created_at:
          type: string
          format: date-time
          example: "2026-02-24T12:34:56Z"
    HouseholdWithRoleResponse:
      type: object
      required: [id, name, role, created_at]
      properties:
        id:
          type: string
          format: uuid
          example: 8cd4bd93-c93f-4b39-9ebb-c787f9a6d268
        name:
          type: string
          example: Wonderland Flat
        role:
          type: string
          example: owner
        created_at:
          type: string
          format: date-time
          example: "2026-02-24T12:34:56Z"
    HouseholdsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdWithRoleResponse"
        next_cursor:
          type: string
          nullable: true
          example: MTcwODc4ODQwMDAwMDAwMDAwfDhjZDRiZDkzLWM5M2YtNGIzOS05ZWJiLWM3ODdmOWE2ZDI2OA
    InviteMemberRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: rabbit@example.com
    HouseholdMemberResponse:
      type: object
      required: [user_id, email, name, role, created_at]
      properties:
        user_id:
          type: string
          format: uuid
          example: b7fc6f55-2d53-413b-b0fe-87cb16bf04c1
        email:
          type: string
          format: email
          example: rabbit@example.com
        name:
          type: string
          example: White Rabbit
        role:
          type: string
          example: member
        created_at:
          type: string
          format: date-time
          example: "2026-02-24T12:40:00Z"
    HouseholdMembersResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdMemberResponse"
        next_cursor:
          type: string
          nullable: true
          example: MTcwODc4ODQwMDAwMDAwMDAwfGI3ZmM2ZjU1LTJkNTMtNDEzYi1iMGZlLTg3Y2IxNmJmMDRjMQ
